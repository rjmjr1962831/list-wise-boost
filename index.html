    <script>

  <body>
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-P3MLNSCV"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->
    
    <div id="root">
      <!-- Initial loading state shown before React loads -->
      <style>
        #initial-loader {
          position: fixed;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: center;
          background: linear-gradient(to bottom right, hsl(var(--background)), hsl(var(--background)), hsl(var(--primary) / 0.05));
          min-height: 100vh;
        }
        #initial-loader .content {
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 1.5rem;
          min-height: 400px;
          justify-content: center;
        }
        #initial-loader .title {
          font-size: 1.25rem;
          font-weight: 600;
          color: hsl(var(--foreground));
          display: flex;
          align-items: center;
          gap: 0.5rem;
        }
        #initial-loader .sources {
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 0.75rem;
          font-size: 1.125rem;
          color: hsl(var(--muted-foreground));
        }
        #initial-loader .source {
          opacity: 0;
          animation: fadeInSource 0.3s ease-out forwards;
        }
        #initial-loader .dots span {
          animation: bounce 1s ease-in-out infinite;
        }
        #initial-loader .dots span:nth-child(2) {
          animation-delay: 0.2s;
        }
        #initial-loader .dots span:nth-child(3) {
          animation-delay: 0.4s;
        }
        @keyframes bounce {
          0%, 100% { transform: translateY(0); }
          50% { transform: translateY(-5px); }
        }
        @keyframes fadeInSource {
          from {
            opacity: 0;
            transform: translateY(10px);
          }
          to {
            opacity: 1;
            transform: translateY(0);
          }
        }
        :root {
          --background: 0 0% 100%;
          --foreground: 0 0% 3.9%;
          --primary: 24 95% 53%;
          --muted-foreground: 0 0% 45%;
        }
        @media (prefers-color-scheme: dark) {
          :root {
            --background: 0 0% 3.9%;
            --foreground: 0 0% 98%;
            --muted-foreground: 0 0% 63.9%;
          }
        }
      </style>
      <div id="initial-loader">
        <div class="content">
          <div class="title">
            Searching more than 500,000 data points
            <span class="dots">
              <span>.</span>
              <span>.</span>
              <span>.</span>
            </span>
          </div>
          <div class="sources">
            <div class="source" style="animation-delay: 0s;">Google</div>
            <div class="source" style="animation-delay: 0.5s;">Agent websites</div>
            <div class="source" style="animation-delay: 1s;">Yelp</div>
            <div class="source" style="animation-delay: 1.5s;">Zillow</div>
            <div class="source" style="animation-delay: 2s;">X</div>
            <div class="source" style="animation-delay: 2.5s;">Instagram</div>
            <div class="source" style="animation-delay: 3s;">Facebook</div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
